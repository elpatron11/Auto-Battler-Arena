      type: object
      required: [id, cycle, kind, value, expiresAt, name, icon]
      properties:
        id: { $ref: "#/components/schemas/DungeonEncounterId" }
        cycle: { type: integer }
        kind: { type: string, enum: [maxHp, damage, healing] }
