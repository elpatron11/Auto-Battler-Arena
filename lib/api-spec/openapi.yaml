        icon: { type: string }
    DungeonStatus:
      type: object
      required: [serverNow, cycle, resetAt, encounterId, completed, activeBuff]
      properties:
        serverNow: { type: integer, description: Current server epoch milliseconds. }
        cycle: { type: integer, description: Floor of serverNow divided by one hour in milliseconds. }
        resetAt: { type: integer, description: Epoch milliseconds at the next hourly reset. }
        encounterId: { $ref: "#/components/schemas/DungeonEncounterId" }
        completed: { type: boolean }
        activeBuff:
          oneOf:
            - $ref: "#/components/schemas/DungeonBuff"
