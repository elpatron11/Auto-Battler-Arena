openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: arena
    description: Authenticated asynchronous arena operations
  - name: dungeon
    description: Hourly rotating dungeon encounters and completion buffs
paths:
  /guilds:
    get:
      operationId: getGuildFoundation
      tags: [guilds]
      responses:
        "200":
          description: Guild directory, membership, invitations and player directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildFoundation" }
  /guilds/action:
    post:
      operationId: actGuildFoundation
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuildActionInput" }
      responses:
        "200":
          description: Updated guild foundation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildFoundation" }
        "400": { description: Invalid action }
        "409": { description: Capacity or membership conflict }
  /guild-wars:
    get:
      operationId: getGuildWarsLobby
      tags: [guilds]
      responses:
        "200":
          description: Development-only Guild Wars lobby
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildWarsLobby" }
  /guild-wars/join:
    post:
      operationId: joinGuildWar
      tags: [guilds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuildWarJoinInput" }
      responses:
        "200":
          description: Allocated room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildWarReceipt" }
        "409": { description: Event closed or player already in another room }
  /guild-wars/rooms/{roomId}/command:
    post:
      operationId: commandGuildWar
      tags: [guilds]
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuildWarCommandInput" }
      responses:
        "200":
          description: Accepted command
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildWarReceipt" }
  /guild-wars/rooms/{roomId}/leave:
    post:
      operationId: leaveGuildWar
      tags: [guilds]
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Left room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuildWarReceipt" }
  /guild-wars/rooms/{roomId}/stream:
    get:
      operationId: streamGuildWar
      tags: [guilds]
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authenticated SSE full-state stream; new connections receive current state immediately
          content:
            text/event-stream:
              schema: { type: string }
  /store/checkout:
    post:
      operationId: createStoreCheckout
      tags: [store]
      summary: Create or resume Stripe test checkout; never enable live charges
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorePurchaseInput" }
      responses:
        "200":
          description: Hosted Stripe test checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCheckout" }
        "401": { description: Sign in required }
        "403": { description: Development test checkout only }
        "409": { description: "Owned, expired or rotating offer" }
        "503": { description: Stripe checkout unavailable }
  /store/checkout/{sessionId}:
    get:
      operationId: getStoreCheckout
      tags: [store]
      summary: Verify the signed-in player's Stripe test payment and fulfill only a preview
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Server-verified test payment status and Store state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCheckoutStatus" }
        "401": { description: Sign in required }
        "403": { description: Test checkout disabled }
        "404": { description: Session not owned by this player }
        "503": { description: Stripe verification unavailable }
  /store:
    get:
      operationId: getStore
      tags: [store]
      summary: Store catalog and isolated test Battle Pass progression
      responses:
        "200":
          description: Current offers and weekly paid-track preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreState" }
  /store/test-purchases:
    post:
      operationId: purchaseStoreTestOffer
      tags: [store]
      summary: Activate a no-charge preview entitlement, never a payment or real inventory grant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorePurchaseInput" }
      responses:
        "200":
          description: Updated isolated preview state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreState" }
        "400": { description: Invalid offer }
        "401": { description: Sign in required }
        "403": { description: Test purchases disabled in production }
        "409": { description: Offer rotation changed }
  /store/test-claims:
    post:
      operationId: claimStoreTestReward
      tags: [store]
      summary: Claim an earned preview reward without changing real Gold or gameplay ownership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreClaimInput" }
      responses:
        "200":
          description: Updated preview reward states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreState" }
        "400": { description: Invalid reward }
        "401": { description: Sign in required }
        "403": { description: Test claims disabled in production }
        "409": { description: Pass not activated or milestone not earned }
        "410": { description: Weekly pass expired }
  /store/claims:
    post:
      operationId: claimStoreReward
      tags: [store]
      summary: Claim a paid-pass milestone with real account rewards in production
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreClaimInput" }
      responses:
        "200":
          description: Updated real reward states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreState" }
        "400": { description: Invalid reward }
        "401": { description: Sign in required }
        "403": { description: Live claims unavailable in this environment }
        "409": { description: Pass not paid or milestone not earned }
        "410": { description: Weekly pass expired }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dungeon/status:
    get:
      operationId: getDungeonStatus
      tags: [dungeon]
      summary: Read the global hourly dungeon rotation and, when signed in, your completion and buff
      responses:
        "200":
          description: Current server-owned dungeon rotation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DungeonStatus" }
  /dungeon/attempts:
    post:
      operationId: createDungeonAttempt
      tags: [dungeon]
      summary: Register an authenticated browser-played dungeon attempt
      description: Attempts are idempotent per account and requestId, have a sixty-attempt hourly abuse safeguard, and cannot start after the account completes that cycle's encounter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DungeonAttemptInput" }
      responses:
        "201":
          description: New attempt registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DungeonAttempt" }
        "200":
          description: Idempotent replay of an existing attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DungeonAttempt" }
        "401": { description: Authentication required }
        "409": { description: The current hourly encounter is already complete }
        "429": { description: Attempt limit reached for the current hourly cycle }
  /dungeon/attempts/{attemptId}/finish:
    post:
      operationId: finishDungeonAttempt
      tags: [dungeon]
      summary: Record the browser-reported result and award a single hourly completion buff on a qualifying win
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DungeonAttemptFinishInput" }
      responses:
        "200":
          description: Idempotent settlement receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DungeonAttemptFinishReceipt" }
        "401": { description: Authentication required }
        "404": { description: Attempt not found for the signed-in account }
        "409": { description: A win cannot be settled before the minimum play duration }
  /arena/profile:
    get:
      operationId: getArenaProfile
      tags: [arena]
      summary: Load or create the signed-in player's game profile
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaProfile"
    put:
      operationId: saveArenaProfile
      tags: [arena]
      summary: Save the signed-in player's local game progression and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaProfile"
  /arena/defense:
    put:
      operationId: publishArenaDefense
      tags: [arena]
      summary: Publish a three-hero defense for offline challenges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaDefenseInput"
      responses:
        "200":
          description: Defense published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaDefenseStatus"
  /arena/players:
    get:
      operationId: listArenaPlayers
      tags: [arena]
      summary: Discover players with published defenses, without revealing their lineups
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
      responses:
        "200":
          description: Players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArenaPlayer"
  /arena/profiles:
    get:
      operationId: searchArenaProfiles
      tags: [arena]
      summary: Search signed-in players' public Arena profiles
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
        - in: query
          name: search
          required: false
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Matching player profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArenaProfileCard" }
  /arena/profiles/{playerId}:
    get:
      operationId: getArenaPublicProfile
      tags: [arena]
      summary: View a player's Arena profile and featured replays
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
        - in: path
          name: playerId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public profile, with private recent matches when viewing your own profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaPublicProfile" }
  /arena/notifications:
    get:
      operationId: listArenaNotifications
      tags: [arena]
      summary: Get unread Arena result updates to show when signing back in
      responses:
        "200":
          description: Up to 100 unread results, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArenaNotification" }
  /arena/notifications/read:
    post:
      operationId: markArenaNotificationsRead
      tags: [arena]
      summary: Dismiss only the notifications the player has seen
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArenaNotificationsReadInput" }
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaNotificationsReadReceipt" }
  /arena/leaderboard:
    get:
      operationId: getArenaLeaderboard
      tags: [arena]
      summary: Rank players with published defenses
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
      responses:
        "200":
          description: Ranked players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArenaPlayer"
  /arena/challenges:
    get:
      operationId: listArenaChallenges
      tags: [arena]
      summary: Recent outgoing matches and incoming defense battles
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
      responses:
        "200":
          description: Challenges involving the signed-in player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArenaChallenge"
    post:
      operationId: createArenaChallenge
      tags: [arena]
      summary: Settle a ranked match from frozen teams on the server and reveal the defense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaChallengeInput"
      responses:
        "201":
          description: Created challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaChallengeTicket"
  /arena/opponents:
    get:
      parameters:
        - $ref: "#/components/parameters/RankedTeamSize"
      operationId: listArenaOpponentRecords
      tags: [arena]
      summary: Lifetime head-to-head results for the signed-in player against each arena opponent
      responses:
        "200":
          description: Completed arena matches grouped by opponent, newest opponent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArenaOpponentRecord"
  /arena/challenges/{challengeId}/result:
    post:
      operationId: finishArenaChallenge
      tags: [arena]
      summary: Retrieve the server-resolved ranked result and optionally save local fight statistics
      parameters:
        - in: path
          name: challengeId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaResultInput"
      responses:
        "200":
          description: Result and rating change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaResultReceipt"
  /economy:
    get:
      operationId: getEconomy
      tags: [arena]
      summary: Read the signed-in player's authoritative wallet, unlocks, and tradable copies
      responses:
        "200":
          description: Economy ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomyAccount" }
  /economy/local-matches:
    post:
      operationId: startEconomyLocalMatch
      tags: [arena]
      summary: Register a local AI match before play begins
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalMatchStartInput" }
      responses:
        "201":
          description: Local match ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalMatchTicket" }
  /economy/local-matches/{matchId}/finish:
    post:
      operationId: finishEconomyLocalMatch
      tags: [arena]
      summary: Award local AI win Gold once for a registered match
      parameters:
        - in: path
          name: matchId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalMatchFinishInput" }
      responses:
        "200":
          description: Gold credited for this local match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalMatchReceipt" }
  /economy/bootstrap:
    post:
      operationId: bootstrapEconomy
      tags: [arena]
      summary: Initialize a new account once with three client-selected free classes and a selected racial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EconomyBootstrapInput" }
      responses:
        "201":
          description: New economy account initialized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EconomyBootstrapReceipt" }
        "409": { description: Account already initialized }
  /economy/tournaments/enter:
    post:
      operationId: enterEconomyTournament
      tags: [arena]
      summary: Pay the entry fee and resolve a bounded server-simulated six-team tournament
      description: Five server-selected canonical Arena bots join the player in a bracket. Each best-of-three is a deterministic 2-0 representation of one server-resolved ranked battle; ties advance the first seeded team. This is not verification of a played client tournament or player performance. Accounts may enter at most three tournaments in a rolling 24-hour window, and prizes cannot be claimed until 90 seconds after entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentEnterInput" }
      responses:
        "201":
          description: Tournament entry created; placement and bracket are server-computed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentRun" }
        "200":
          description: Idempotent replay of the original entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentRun" }
        "400": { description: Invalid request or attack snapshot }
        "403": { description: Attack snapshot includes unowned loadout items }
        "409": { description: Insufficient Gold or requestId is already owned by another player }
        "429": { description: Three tournament entries have already been created during the rolling 24-hour window }
  /economy/tournaments:
    get:
      operationId: listEconomyTournaments
      tags: [arena]
      summary: List the signed-in player's authoritative tournament history
      responses:
        "200":
          description: Tournament runs ordered by entry time
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TournamentRun" }
  /economy/tournaments/{tournamentId}/finish:
    post:
      operationId: finishEconomyTournament
      tags: [arena]
      summary: Settle the played tournament placement exactly once, no sooner than 90 seconds after entry
      parameters:
        - in: path
          name: tournamentId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentResultInput" }
      responses:
        "200":
          description: Authoritative placement, prize, wallet balance, and bracket history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentRun" }
        "404": { description: Tournament run not found for this player }
        "409": { description: Minimum tournament duration has not elapsed or the wallet cannot accept the prize }
  /market/listings:
    get:
      operationId: listMarketListings
      tags: [arena]
      summary: Browse active player-market listings
      responses:
        "200":
          description: Active listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketListing" }
    post:
      operationId: createMarketListing
      tags: [arena]
      summary: List one owned duplicate copy for Gold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketListingInput" }
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketListing" }
  /market/listings/{listingId}:
    delete:
      operationId: cancelMarketListing
      tags: [arena]
      summary: Cancel the signed-in seller's listing
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Listing cancelled }
  /market/listings/{listingId}/purchase:
    post:
      operationId: purchaseMarketListing
      tags: [arena]
      summary: Purchase a listing with server-held Gold and apply 10 percent tax
      parameters:
        - in: path
          name: listingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Purchase receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketPurchaseReceipt" }
  /economy/unlock/class:
    post:
      operationId: unlockClass
      tags: [arena]
      summary: Unlock a class at the account's current escalating class price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassUnlockInput" }
      responses:
        "200": { description: Class unlocked }
  /economy/unlock/racial:
    post:
      operationId: unlockRacial
      tags: [arena]
      summary: Unlock a racial at the account's current escalating racial price
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RacialUnlockInput" }
      responses:
        "200": { description: Racial unlocked }
  /arena/challenges/{challengeId}:
    get:
      operationId: getArenaChallenge
      tags: [arena]
      summary: Full team compositions and recorded stats for a participant
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Match detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaChallengeDetail"
  /arena/challenges/{challengeId}/feature:
    post:
      operationId: featureArenaMatch
      tags: [arena]
      summary: Save a completed recording on your profile (up to five)
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaFeatureReceipt" }
    delete:
      operationId: unfeatureArenaMatch
      tags: [arena]
      summary: Remove a saved recording from your profile
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArenaFeatureReceipt" }
  /arena/challenges/{challengeId}/recording-upload:
    post:
      operationId: requestArenaRecordingUpload
      tags: [arena]
      summary: Reserve a private upload for a completed match recording
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaRecordingRequest"
      responses:
        "200":
          description: Temporary direct-upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaRecordingUpload"
  /arena/challenges/{challengeId}/recording:
    post:
      operationId: finishArenaRecording
      tags: [arena]
      summary: Attach an uploaded video or snapshot replay to the participant's match
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArenaRecordingInput"
      responses:
        "200":
          description: Recording available to match participants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArenaRecordingStatus"
    get:
      operationId: getArenaRecording
      tags: [arena]
      summary: Stream a match recording to an authenticated participant
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Participant-only video recording or snapshot replay (video supports byte ranges)
          content:
            video/webm: {}
            video/mp4: {}
            application/vnd.arena.replay+json: {}
components:
  parameters:
    RankedTeamSize:
      in: query
      name: teamSize
      required: false
      schema: { type: integer, enum: [2, 3] }
  schemas:
    GuildActionInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [create, update, invite, accept, decline, revoke, join, leave, kick, transfer] }
        guildId: { type: string }
        playerId: { type: string }
        name: { type: string, minLength: 3, maxLength: 24 }
