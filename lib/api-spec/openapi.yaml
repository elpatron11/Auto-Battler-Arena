        opponentName: { type: string }
        opponentRating: { type: integer }
        defense:
          type: object
          additionalProperties: true
        attackBuff:
          allOf:
            - $ref: "#/components/schemas/DungeonBuff"
          description: Optional attacker buff snapshot, omitted after it expires.
        defenseBuff:
          allOf:
            - $ref: "#/components/schemas/DungeonBuff"
          description: Optional defender buff snapshot, omitted after it expires.
        createdAt: { type: string, format: date-time }
