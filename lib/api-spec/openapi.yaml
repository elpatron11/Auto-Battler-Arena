        itemId: { type: string }
        name: { type: string }
        description: { type: string }
        art: { type: string }
        gold: { type: integer }
        state: { type: string, enum: [locked, available, claimed] }
    StorePass:
      type: object
      required: [id, templateId, featuredClass, title, description, startsAt, endsAt, priceCents, offerId, purchasedAt, wins, targetWins, rewards, claimedGold]
      properties:
        id: { type: string }
        templateId: { type: string }
        featuredClass: { type: string }
        title: { type: string }
        description: { type: string }
        startsAt: { type: string }
        endsAt: { type: string }
        priceCents: { type: integer }
        offerId: { type: string }
        purchasedAt: { type: [string, "null"] }
        wins: { type: integer }
        targetWins: { type: integer }
        rewards:
          type: array
          items: { $ref: "#/components/schemas/StoreReward" }
        claimedGold: { type: integer }
    StoreState:
      type: object
      required: [serverTime, signedIn, testPurchasesEnabled, stripeCheckoutEnabled, checkoutMode, offers, pass, previewBadges, earnedBadges]
      properties:
        serverTime: { type: string }
        signedIn: { type: boolean }
        testPurchasesEnabled: { type: boolean }
        stripeCheckoutEnabled: { type: boolean }
        checkoutMode: { type: string, enum: [test, live, "off"] }
        earnedBadges:
          type: array
          items: { type: string }
        offers:
          type: array
          items: { $ref: "#/components/schemas/StoreOffer" }
        pass: { $ref: "#/components/schemas/StorePass" }
        previewBadges:
          type: array
          items: { type: string }
    StoreCheckout:
      type: object
      required: [sessionId, url]
      properties:
        sessionId: { type: string }
        url: { type: string }
    StoreCheckoutStatus:
      type: object
      required: [status, store]
      properties:
        status: { type: string, enum: [pending, complete, expired] }
        store: { $ref: "#/components/schemas/StoreState" }

