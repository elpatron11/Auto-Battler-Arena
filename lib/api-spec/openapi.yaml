                      classId: { type: string, enum: [frostmage, priest, warrior, rogue, paladin, archer, warlock, druid, shaman] }
                captainClass: { type: [string, "null"] }
            featuredMatches:
              type: array
              items: { $ref: "#/components/schemas/ArenaFeaturedMatch" }
            recentMatches:
              type: array
              description: Only included for the owner; never expose unfeatured replays to other players.
              items: { $ref: "#/components/schemas/ArenaFeaturedMatch" }
    ArenaRankedScore:
      type: object
      required: [rating, wins, losses]
      properties:
        rating: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
