<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Connection unavailable — Fantasy World Arenas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)); background: #101a2d; color: #f4f5fa; font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 430px; padding: 28px; border: 1px solid #4b5977; border-radius: 20px; }
    h1 { font: bold 28px/1.2 Georgia, serif; color: #ffda70; }
    p { color: #c4ccdc; }
    a { display: block; padding: 14px; border-radius: 12px; background: #ffcf57; color: #101a2d; font-weight: 700; text-align: center; text-decoration: none; }
    small { display: block; margin-top: 20px; color: #a7b4cb; }
  </style>
</head>
<body>
  <main>
    <h1>Connection unavailable</h1>
    <p>The game could not connect. Check your internet connection and try again. Your account progress stays on the server.</p>
    <a href="https://auto-battler-arena.replit.app">Try again</a>
    <small>Private Android test app · online play required</small>
  </main>

</html>
